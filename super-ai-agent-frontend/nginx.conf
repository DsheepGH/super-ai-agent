# ============================================================
# SUPER AI 前端 Nginx 配置
#
# Dockerfile 会把本文件复制为：
#   /etc/nginx/templates/default.conf.template
# 容器启动时由官方 Nginx 镜像的 envsubst 用环境变量
# BACKEND_UPSTREAM 渲染成 /etc/nginx/conf.d/default.conf。
#
# BACKEND_UPSTREAM 示例：http://backend:8123
# 注意：不要以 / 结尾，否则 /api/ 前缀会被替换掉。
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    client_max_body_size 20m;

    # 微信云托管健康检查
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ========================================================
    # API 反向代理
    #
    # 浏览器只请求当前域名下的 /api/...，由 Nginx 转发给后端。
    # 对浏览器来说前后端同源，因此不存在 CORS 问题。
    # ========================================================
    location /api/ {
        proxy_pass ${BACKEND_UPSTREAM};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name $proxy_host;

        # 转发给后端时使用后端自己的 Host，避免公网后端网关因 Host/SNI
        # 与证书域名不一致而返回 421 Misdirected Request。
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # SSE 使用普通 HTTP/1.1 长连接即可。
        proxy_set_header Connection "";

        # 避免后端压缩 SSE 流，否则内容可能被攒批后才返回。
        proxy_set_header Accept-Encoding "";
        gzip off;

        # SSE 流式响应关键配置：不缓冲、不缓存、长超时。
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;

        # 同源代理下不向后端透传浏览器的 Origin，
        # 避免后端 CORS 过滤器把代理请求误判为跨域请求。
        proxy_set_header Origin "";
    }

    # Vite 构建产物文件名带内容 hash，适合长期缓存。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location = /favicon.svg {
        expires 7d;
        access_log off;
    }

    # 入口 HTML 不缓存，保证发布后立即拿到新版本。
    location = /index.html {
        expires -1;
    }

    # Vue Router history 模式：所有前端路由回退到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 基础安全响应头。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态资源压缩。API 响应在 /api/ 中已单独关闭 gzip。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 同源部署不需要下面这些 CORS 响应头。
    # 如确实有其它域名要直接调用本代理，再按需取消注释，
    # 并且不要与 Cookie 凭证模式一起使用通配符 *。
    # add_header Access-Control-Allow-Origin "https://your-frontend.example.com" always;
    # add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    # add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
}
